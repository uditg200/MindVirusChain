[project]
name = "virus-chain"
version = "0.2.0"
description = "Agent-to-agent mind-virus spread evaluation framework"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "openai>=1.0",
    "pyyaml>=6.0",
    "litellm>=1.82",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "matplotlib>=3.10.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/virus_chain"]

[project.scripts]
viewer = "virus_chain.viewer:main"
evolve-lowvar = "virus_chain.experiments.evolution:main"
